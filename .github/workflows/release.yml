name: Release

# Build installers for all three desktop OSes when a version tag is pushed
# (e.g. `git tag v0.2.0 && git push origin v0.2.0`), then attach them to ONE
# GitHub Release.
#
# Two stages on purpose: the matrix BUILDS and uploads each OS's installers as
# workflow artifacts (no release writes, so no cross-job race), then a single
# `release` job downloads them all and creates the release. The old design ran
# the release upload inside the matrix with `draft: true`, so three concurrent
# jobs raced on the same tag and the installers never landed on the published
# release. `if-no-files-found: error` + `fail_on_unmatched_files: true` make the
# job fail loudly if installers are ever missing, instead of shipping only the
# auto-generated source archives.
#
# Installers are UNSIGNED for now — code-signing/notarization is a later step.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      # A pushed tag (vX.Y.Z) and package.json's version are two independent
      # sources of truth, and nothing else here cross-checks them.
      # electron-builder writes latest.yml's `version` field FROM package.json,
      # not from the git tag — so if a maintainer forgets the package.json
      # bump (a documented but unenforced convention), the release still
      # builds and publishes green, just with installers and metadata
      # labelled the OLD version. Every Windows/Linux client then reads that
      # metadata, concludes it is already up to date, and never updates
      # again — silently, with no error anywhere. Only a tag push carries a
      # tag to check against; `workflow_dispatch` has none, so this only runs
      # for tag pushes.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version $tag_version) does not match package.json's version $pkg_version. latest.yml's 'version' field is written from package.json, not the tag, so this mismatch would ship a release labelled with the wrong version — every installed client would compare against $pkg_version, wrongly conclude it is already up to date, and silently never receive this update. Bump package.json to $tag_version (per CLAUDE.md's release convention) and push a matching tag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version $pkg_version"
      # Gate the release on the same checks CI runs, so a broken build never ships.
      - run: npm run typecheck
      - run: npm test
      - name: Package installers
        shell: bash
        # Tee'd so the icon check below can inspect what electron-builder said.
        # Safe to pipe: Actions runs `shell: bash` as `bash --noprofile --norc
        # -eo pipefail`, so a failing `npm run dist` still fails the step rather
        # than being masked by tee's exit code. Do not switch this to the
        # default shell without re-checking that.
        run: npm run dist 2>&1 | tee dist.log
        env:
          # Never let electron-builder try to sign without credentials.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder generates the platform icon from build/icon.svg into a
      # `.icon-<fmt>` directory beside the installers. When it cannot, it does
      # NOT fail the build: `resolveIcon` sets `isFallback` and only logs
      # "default Electron icon is used" (app-builder-lib/out/platformPackager.js).
      # That silent fallback is exactly how every release up to v0.3.2 shipped
      # unbranded without anyone noticing.
      #
      # Both signals are checked. The directory alone is not enough — the
      # fallback path still writes one, just containing Electron's icon. The
      # log line is the authoritative signal; the directory check catches the
      # case where conversion did not run at all.
      #
      # The SVG→.ico path is verified locally on Windows; SVG→.icns cannot be
      # exercised from a Windows or Linux machine, so CI is the only place it
      # is ever proven.
      - name: Verify the app icon was generated
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) expected=release/.icon-ico ;;
            macos-latest)   expected=release/.icon-icns ;;
            *)              expected=release/.icon-set ;;
          esac
          if grep -qi "default .* icon is used" dist.log; then
            echo "::error::electron-builder fell back to the default Electron icon instead of building from build/icon.svg — the installer would ship unbranded. It logs this as a warning and does not fail on its own, which is why this step exists. Check that build/icon.svg exists and is valid SVG."
            grep -i "icon" dist.log || true
            exit 1
          fi
          if [ ! -d "$expected" ] || [ -z "$(ls -A "$expected" 2>/dev/null)" ]; then
            echo "::error::$expected is missing or empty, so electron-builder never converted build/icon.svg for this platform. Directories present: $(ls -d release/.icon-* 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          echo "Generated icon: $expected -> $(ls -A "$expected" | tr '\n' ' ')"
      # latest*.yml is the update metadata electron-updater reads (it carries the
      # SHA512 of each installer). All three runners emit one — latest.yml,
      # latest-linux.yml, latest-mac.yml (verified on the v0.3.0 release).
      # Without these files on the release, every in-app update check fails, so
      # they ship alongside the installers.
      #
      # Only Windows and Linux are VERIFIED below. Modelith never reads
      # latest-mac.yml: macOS goes through CheckOnlyBackend, which queries the
      # GitHub API directly. It would be unusable anyway — it points at the dmg,
      # and Squirrel.Mac updates from a zip. Requiring a file we do not consume
      # would only add a way for the release to fail for no reason.
      #
      # if-no-files-found below only fires when NOTHING in the whole path list
      # matches, and the installer globs alone satisfy that on any successful
      # build — so a regression that silently drops just latest*.yml (e.g. the
      # `publish:` block disappearing from electron-builder.yml) would stay
      # green. This step catches that case explicitly, per OS, before upload.
      - name: Verify update metadata was generated
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            expected="release/latest.yml"
          else
            expected="release/latest-linux.yml"
          fi
          if [ ! -f "$expected" ]; then
            echo "::error::$expected is missing. electron-updater reads this file to detect new releases; without it every in-app update check fails on this platform. Check that electron-builder.yml still has a 'publish:' provider configured (required for electron-builder to emit update metadata) and that 'npm run dist' completed successfully."
            exit 1
          fi
          echo "Found $expected"

          # Every filename latest*.yml points at must exist EXACTLY as named.
          # Existing metadata is not enough — v0.3.1 shipped a latest.yml
          # referencing `Modelith-Setup-0.3.1.exe` while the artifact was
          # `Modelith Setup 0.3.1.exe` (NSIS's default name has spaces, which
          # GitHub then turns into dots). Every Windows client that tried to
          # update got a 404. A filename mismatch is invisible to every other
          # check in this workflow, so assert it directly.
          missing=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ -f "release/$name" ]; then
              echo "  ok: $name"
            else
              echo "::error::$expected references '$name', but no such file exists in release/. Clients read that name to build the download URL, so every in-app update would 404. Files actually built: $(ls release/ | tr '\n' ' '). Fix the artifactName in electron-builder.yml so the built filename matches — and avoid spaces, which GitHub rewrites on upload."
              missing=1
            fi
          done <<< "$(sed -n 's/^[[:space:]]*-\{0,1\}[[:space:]]*url:[[:space:]]*//p' "$expected")"
          [ "$missing" -eq 0 ] || exit 1
      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/latest*.yml
          # Fail the job if packaging produced nothing to upload.
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only cut a release for tag pushes; a manual run just proves the build.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Show what was collected
        run: ls -R dist-artifacts
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          draft: false
          generate_release_notes: true
          # If none of the installers matched, fail instead of a source-only release.
          fail_on_unmatched_files: true
