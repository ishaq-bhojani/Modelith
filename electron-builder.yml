# Packaging config for Modelith (electron-builder).
# Produces installers from the electron-vite output in out/.
# `npm run dist` builds + packages for the current OS; the release workflow
# runs it on Windows/macOS/Linux. Unsigned for now — code-signing (Windows
# cert, Apple notarization) is a later step; see docs/qa launch checklist.
appId: dev.modelith.app
productName: Modelith
copyright: Modelith contributors

# The renderer/main/preload are already compiled by electron-vite into out/.
# Package that plus the manifest; nothing else needs to ship.
files:
  - out/**/*
  - package.json
directories:
  output: release
  buildResources: build

# electron-builder auto-installs the correct Electron runtime from the
# devDependency version; asar keeps the app bundle compact.
asar: true

# Required for auto-update: this is what makes electron-builder emit the
# latest.yml / latest-linux.yml metadata that electron-updater reads.
#
# !! The `--publish never` flag in package.json's `dist` script is LOAD-BEARING
# because of this block. With a publish provider configured, electron-builder
# implicitly publishes when it sees a git tag — that is exactly what broke the
# v0.2.0 release, putting installers into a separate draft release instead of
# the published one. The workflow's release job owns publishing. Do not remove
# `--publish never`.
publish:
  provider: github
  owner: ishaq-bhojani
  repo: Modelith

win:
  target:
    - nsis
    - zip
linux:
  target:
    - AppImage
  category: Development
mac:
  target:
    - dmg
  category: public.app-category.developer-tools

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
