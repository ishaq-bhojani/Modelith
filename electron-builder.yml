# Packaging config for Modelith (electron-builder).
# Produces installers from the electron-vite output in out/.
# `npm run dist` builds + packages for the current OS; the release workflow
# runs it on Windows/macOS/Linux. Unsigned for now — code-signing (Windows
# cert, Apple notarization) is a later step; see docs/qa launch checklist.
appId: dev.modelith.app
productName: Modelith
copyright: Modelith contributors

# The renderer/main/preload are already compiled by electron-vite into out/.
# Package that plus the manifest; nothing else needs to ship.
files:
  - out/**/*
  - package.json
directories:
  output: release
  buildResources: build

# electron-builder auto-installs the correct Electron runtime from the
# devDependency version; asar keeps the app bundle compact.
asar: true

# Required for auto-update: this is what makes electron-builder emit the
# latest.yml / latest-linux.yml metadata that electron-updater reads.
#
# !! The `--publish never` flag in package.json's `dist` script is LOAD-BEARING
# because of this block. With a publish provider configured, electron-builder
# implicitly publishes when it sees a git tag — that is exactly what broke the
# v0.2.0 release, putting installers into a separate draft release instead of
# the published one. The workflow's release job owns publishing. Do not remove
# `--publish never`.
publish:
  provider: github
  owner: ishaq-bhojani
  repo: Modelith

win:
  target:
    - nsis
    - zip
linux:
  target:
    - AppImage
  category: Development
mac:
  # Both architectures. `macos-latest` runners are Apple Silicon, so a bare
  # `dmg` target builds arm64 ONLY — which is what v0.3.0 shipped, leaving Intel
  # users with nothing they could install. The failure is asymmetric and worth
  # remembering: an x64 build runs on Apple Silicon under Rosetta, but an arm64
  # build will not launch on Intel at all.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  # electron-builder's default artifact name OMITS the arch suffix for x64
  # (that is why v0.3.0 produced `Modelith-0.3.0-arm64.dmg` next to a bare
  # `Modelith-0.3.0.AppImage`). Building both arches with that default would
  # give `Modelith-0.3.0.dmg` and `Modelith-0.3.0-arm64.dmg` — and the
  # unlabelled one is the Intel build, which is precisely the file an Apple
  # Silicon user would assume is "the normal one". Name both explicitly.
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.developer-tools

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # No spaces in the installer filename, or auto-update 404s on Windows.
  #
  # The NSIS default is "${productName} Setup ${version}.${ext}" — with spaces.
  # electron-builder writes latest.yml's `url` with those spaces replaced by
  # HYPHENS (it assumes it will publish the file itself), but our workflow
  # uploads the artifact via actions, and GitHub replaces spaces with DOTS. So
  # v0.3.1 shipped `Modelith.Setup.0.3.1.exe` while latest.yml pointed clients
  # at `Modelith-Setup-0.3.1.exe` — a 404 for every Windows client that tried
  # to update. Naming it without spaces makes both agree.
  artifactName: ${productName}-Setup-${version}.${ext}
